name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quotacore-tests:
    name: QuotaCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run QuotaCore tests
        run: swift test --package-path Packages/QuotaCore
